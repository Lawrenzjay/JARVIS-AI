<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ======================================
         JARVIS APPLICATION
    ======================================= -->

    <div class="app-layout">


        <!-- ======================================
             SIDEBAR
        ======================================= -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <!-- Sidebar Header -->

            <div class="sidebar-top">

                <div class="system-label">
                    SYSTEM
                </div>

                <div class="sidebar-title">
                    Recent Chats
                </div>

            </div>


            <!-- New Chat Button -->

            <button
                id="sidebarNewChatButton"
                class="sidebar-new-chat"
                type="button"
            >
                <span class="plus-icon">
                    +
                </span>

                <span>
                    New Chat
                </span>

            </button>


            <!-- Recent Chats List -->

            <div
                id="recentChats"
                class="recent-chats"
            >

                <!-- Recent chats will be generated by script.js -->

            </div>


            <!-- Sidebar Bottom -->

            <div class="sidebar-bottom">

                <div class="local-session">

                    <span
                        class="session-dot"
                    ></span>

                    <span>
                        LOCAL SESSION
                    </span>

                </div>

            </div>

        </aside>


        <!-- ======================================
             MAIN CHAT AREA
        ======================================= -->

        <main
            class="chat-container"
        >


            <!-- ======================================
                 HEADER
            ======================================= -->

            <header
                class="chat-header"
            >

                <div class="header-left">


                    <!-- Mobile Sidebar Button -->

                    <button
                        id="menuButton"
                        class="menu-button"
                        type="button"
                        aria-label="Toggle sidebar"
                        title="Toggle sidebar"
                    >
                        ☰
                    </button>


                    <!-- JARVIS Logo -->

                    <div class="logo">
                        J
                    </div>


                    <!-- System Information -->

                    <div class="header-info">

                        <h2>
                            JARVIS
                        </h2>

                        <p id="statusText">
                            Online
                        </p>

                    </div>

                </div>


                <!-- Header New Chat -->

                <button
                    id="newChatButton"
                    class="new-chat-button"
                    type="button"
                >
                    New Chat
                </button>

            </header>


            <!-- ======================================
                 CHAT MESSAGES
            ======================================= -->

            <section
                class="chat-messages"
                id="chatMessages"
            >

                <!-- Default Welcome Message -->

                <div
                    class="message bot-message"
                >
                    Hello! I am JARVIS.
                    How can I help you?
                </div>

            </section>


            <!-- ======================================
                 CHAT INPUT
            ======================================= -->

            <div
                class="chat-input"
            >


                <!-- Microphone -->

                <button
                    id="micButton"
                    class="mic-button"
                    type="button"
                    title="Talk to JARVIS"
                    aria-label="Talk to JARVIS"
                >
                    🎤
                </button>


                <!-- User Input -->

                <input
                    type="text"
                    id="userInput"
                    placeholder="Talk to JARVIS..."
                    autocomplete="off"
                >


                <!-- Send Button -->

                <button
                    id="sendButton"
                    type="button"
                >
                    Send
                </button>

            </div>


            <!-- ======================================
                 VOICE STATUS
            ======================================= -->

            <div
                id="voiceStatus"
                class="voice-status"
            >
                Say "Hey JARVIS"
            </div>


        </main>


    </div>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script
        src="script.js"
    ></script>


</body>

</html>
